<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GG PARTSPARTS</title>
    <link rel="stylesheet" href="CSS/cadastro.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                    <img src="IMG/Captura_de_tela_2025-10-11_184634-removebg-preview.png" alt="logo">
            </div>
            <div class="nav-icon fotos">
                <i> <img src="IMG/search_4083795.png" alt=""></i>
                <i> <img src="IMG/person_13937526.png" alt=""></i>                
                <i> <img src="IMG/shopping-cart-empty-side-view_34568.png" alt=""></i>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="form-container">
            <h1 class="form-title">Cadastro</h1>
            
            <form class="registration-form">
                <div class="form-group">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" id="nome" name="nome" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" id="cep" name="cep" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input type="text" id="endereco" name="endereco" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-input" required>
                </div>

                <button type="submit" class="submit-button">Concluir Cadastro</button>
            </form>
        </div>
    </main>
</body>
</html>

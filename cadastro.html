<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GG PARTSPARTS</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-cog gear-icon"></i>
                <span class="logo-text">
                    <span class="logo-gg">GG</span>
                    <span class="logo-parts">PARTSPARTS</span>
                </span>
            </div>
            <div class="nav-icons">
                <i class="fas fa-search nav-icon"></i>
                <i class="fas fa-user nav-icon"></i>
                <i class="fas fa-shopping-cart nav-icon"></i>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="form-container">
            <h1 class="form-title">Cadastro</h1>
            
            <form class="registration-form">
                <div class="form-group">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" id="nome" name="nome" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" id="cep" name="cep" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input type="text" id="endereco" name="endereco" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-input" required>
                </div>

                <button type="submit" class="submit-button">Concluir Cadastro</button>
            </form>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GG PARTSPARTS</title>
    <link rel="stylesheet" href="CSS/login-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                    <img src="IMG/Captura_de_tela_2025-10-11_184634-removebg-preview.png" alt="logo">
            </div>
            <div class="nav-icons">
                <i class="fas fa-search nav-icon"></i>
                <i class="fas fa-user nav-icon"></i>
                <i class="fas fa-shopping-cart nav-icon"></i>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="login-container">
            <div class="login-form-wrapper">
                <h1 class="login-title">Login</h1>
                <div class="title-underline"></div>
                
                <form class="login-form">
                    <div class="form-group">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" id="senha" name="senha" class="form-input" required>
                    </div>

                    <button type="submit" class="login-button">Entrar</button>
                </form>
            </div>
        </div>

        <div class="register-link">
            <span class="register-text">Não tem conta? </span>
            <a href="index.html" class="register-link-text">Cadastre-se</a>
        </div>
    </main>
</body>
</html>
